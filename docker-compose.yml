services:
  stats-server:
    build:
      context: stats/stats-server
      dockerfile: Dockerfile
    image: stats-server
    container_name: stats-server
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://stats-db:5432/stats-db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
    restart: unless-stopped

  stats-db:
    image: postgres:16.1
    container_name: postgres_stats
    ports:
      - "6541:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=user
      - POSTGRES_DB=stats-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d stats-db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - stats_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  stats_db_data:
